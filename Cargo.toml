[package]
name = "lintel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Model your home: plans, elevations and a 3D render, for planning changes before you make them."
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "8949c69d27b73d23b41efc05c485e60e4432c3e7" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8949c69d27b73d23b41efc05c485e60e4432c3e7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1.25", features = ["derive"] }
base64 = "0.22"
png = "0.18"
miniz_oxide = "0.8"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }

# Native only: file dialogs, and HTTP for the elevation services.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "8949c69d27b73d23b41efc05c485e60e4432c3e7", features = ["native-file-dialog"] }
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "8949c69d27b73d23b41efc05c485e60e4432c3e7" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Response", "Document", "Blob", "BlobPropertyBag", "Url", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File"] }

# Rune draws through a wgpu-hal with one extra dx12 function; an app that builds Rune patches it too.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "8949c69d27b73d23b41efc05c485e60e4432c3e7" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
codegen-units = 16
incremental = true
