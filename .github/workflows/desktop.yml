# Builds the desktop app for Linux, macOS and Windows on every push to main, and puts the
# three downloads on a rolling "latest" pre-release.
name: Desktop builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: lintel-linux-x86_64
          - os: macos-latest
            name: lintel-macos-arm64
          - os: windows-latest
            name: lintel-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp README.md LICENSE dist/${{ matrix.name }}/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/lintel.exe dist/${{ matrix.name }}/
            (cd dist && 7z a ${{ matrix.name }}.zip ${{ matrix.name }})
          else
            cp target/release/lintel dist/${{ matrix.name }}/
            (cd dist && tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }})
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build" --notes "Built from $GITHUB_SHA. Unsigned: see the README for opening it on macOS and Windows."
